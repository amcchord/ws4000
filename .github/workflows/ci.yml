name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install SDL2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev pkg-config

      - name: Vendor assets
        run: ./tools/vendor-assets.sh

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o ws4000 ./cmd/ws4000

  build-matrix:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_ttf sdl2_mixer pkg-config

      - name: Vendor assets
        shell: bash
        run: ./tools/vendor-assets.sh

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ws4000${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/ws4000

  build-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev pkg-config gcc-arm-linux-gnueabihf

      - name: Vendor assets
        run: ./tools/vendor-assets.sh

      - name: Build Raspberry Pi binary
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CC: arm-linux-gnueabihf-gcc
          CGO_ENABLED: 1
        run: go build -o ws4000-linux-armv7 ./cmd/ws4000
